; takas.openmap.lt — overrides on top of the base image defaults.

session.save_path = /var/lib/php/sessions

; takas never receives an upload: no $_FILES, no move_uploaded_file().
; Turning both off removes the multipart/form-data handling that
; CVE-2026-109618 abused. Ordinary multipart form fields still parse,
; so the FormData posts from login.js keep working.
file_uploads = Off
session.upload_progress.enabled = 0

expose_php = Off
date.timezone = Europe/Vilnius

; Every endpoint answers JSON, so a warning must never reach the body.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
